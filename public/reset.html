<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Script VO Agent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#F7F4EA;--ink:#111111;--nb-shadow:6px 6px 0 #111111}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);
  background-image:radial-gradient(#11111114 1.5px, transparent 1.5px);background-size:22px 22px;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);padding:20px}
.card{background:#fff;border:4px solid #000;border-radius:24px;box-shadow:var(--nb-shadow);padding:36px 32px;width:100%;max-width:380px;text-align:center}
.badge{display:inline-block;font-weight:900;font-size:12px;padding:6px 14px;border-radius:99px;background:#FFC72C;border:3px solid #000;box-shadow:3px 3px 0 #000;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
h1{font-size:30px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
p.sub{color:#444;font-weight:600;font-size:14px;margin-bottom:24px}
label{display:block;text-align:left;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
input{width:100%;padding:13px 14px;font-size:16px;font-weight:600;border:3px solid #000;border-radius:14px;background:#F7F4EA;color:var(--ink);box-shadow:3px 3px 0 #000;margin-bottom:18px;outline:none}
input:focus{background:#fff;box-shadow:5px 5px 0 #000;transform:translate(-1px,-1px)}
button{width:100%;padding:13px;font-size:17px;font-weight:900;cursor:pointer;background:#8AC926;color:#000;border:3px solid #000;border-radius:14px;box-shadow:4px 4px 0 #000;transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
button:disabled{opacity:.6;cursor:wait;transform:none}
.msg{display:none;margin-top:16px;padding:10px 14px;font-weight:800;font-size:14px;background:#FF595E;color:#fff;border:3px solid #000;border-radius:12px;box-shadow:3px 3px 0 #000}
.msg.show{display:block}
.msg.ok{background:#8AC926;color:#000}
.foot{margin-top:22px;font-size:12px;color:#777;font-weight:600}
.foot a{color:#111;font-weight:800}
</style>
</head>
<body>
<div class="card">
  <span class="badge">🔑 Reset Password</span>
  <h1>Password Baru</h1>
  <p class="sub">Buat password baru untuk akunmu. Link reset berlaku 1 jam.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Password Baru</label>
    <input type="password" id="pw" placeholder="••••••••" autocomplete="new-password" autofocus>
    <label for="pw2">Ulangi Password Baru</label>
    <input type="password" id="pw2" placeholder="••••••••" autocomplete="new-password">
    <button type="submit" id="btn">Simpan Password Baru →</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="/login">← Kembali ke login</a></div>
</div>
<script>
const q=new URLSearchParams(location.search);
const token=q.get('token')||'',user=q.get('user')||'';
const f=document.getElementById('f'),pw=document.getElementById('pw'),pw2=document.getElementById('pw2'),
      btn=document.getElementById('btn'),msg=document.getElementById('msg');
const show=(t,ok)=>{msg.textContent=t;msg.classList.add('show');msg.classList.toggle('ok',!!ok)};
if(!token||!user){show('Link reset tidak lengkap. Minta link baru dari halaman login.');btn.disabled=true;}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  msg.classList.remove('show');
  if(pw.value!==pw2.value){show('Ulangi password tidak sama.');return;}
  if(pw.value.length<4){show('Password baru minimal 4 karakter.');return;}
  btn.disabled=true;btn.textContent='Menyimpan…';
  try{
    const r=await fetch('/api/reset',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({user,token,password:pw.value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){show('Password berhasil diganti. Silakan masuk dengan password baru.',true);pw.value='';pw2.value='';btn.textContent='Berhasil ✓';return;}
    show(j.error||'Gagal reset password.');
  }catch(er){show('Server tidak terjangkau.');}
  btn.disabled=false;btn.textContent='Simpan Password Baru →';
});
</script>
</body>
</html>
